[project]
name = "markus-plus-mcp"
version = "0.1.0"
description = "MCP server for markus.plus content access"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "uvicorn[standard]>=0.30",
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "cachetools>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-cachetools>=5.3",
    "types-beautifulsoup4>=4.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.coverage.report]
omit = ["src/markus_plus_mcp/server.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]
